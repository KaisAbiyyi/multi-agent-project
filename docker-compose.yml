services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET_KEY=local-dev-key
      - SEARXNG_INSTANCE_NAME=Aegis Research Proxy
      - SEARXNG_AUTOCOMPLETE=none
      - SEARXNG_REDIS_URL=
    volumes:
      - ./ops/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
